---
- name: Install Node.js and npm
  hosts: my_node_app_servers
  become: yes
  tasks:
    - name: Update apt repo and cache
      apt: update_cache=yes force_apt_get=yes cache_valid_time=3600
    - name: Install nodejs and npm
      apt:
        pkg:
          - nodejs
          - npm

- name: Create user nodeapp
  hosts: my_node_app_servers
  become: yes
  tasks:
    - name: Create user nodeapp
      user:
        name: nodeapp
        group: nodeapp
        state: present

- name: Deploy Node.js application
  hosts: my_node_app_servers
  become: yes
  tasks:
    - name: Create app directory with ownership for nodeapp
      file:
        path: /opt/my-node-app
        state: directory
        owner: nodeapp
        group: nodeapp
        mode: "0755"
    - name: Copy application files to server
      copy:
        src: ./nodejs-app-1.0.0.tgz
        dest: /opt/my-node-app/
        owner: nodeapp
        group: nodeapp
        mode: "0755"
    - name: Extract application files
      unarchive:
        src: /opt/my-node-app/nodejs-app-1.0.0.tgz
        dest: /opt/my-node-app/
        remote_src: yes
        owner: nodeapp
        group: nodeapp
    - name: Install Node.js dependencies
      become_user: nodeapp
      npm:
        path: /opt/my-node-app/package
        state: present
    - name: Start Node.js application
      become_user: nodeapp
      command:
        chdir: /opt/my-node-app/package/app
        cmd: node server
      name: my-node-app
      async: 1000
      poll: 0
    - name: Ensure app is running
      wait_for:
        port: 3000 # your app's port
        host: localhost
        delay: 5 # wait 5s before first check
        timeout: 30 # fail if not up within 30s
        state: started
